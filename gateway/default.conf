server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  location ~ ^/api/auth/(.*)$ {
    rewrite ^/api/auth/(.*)$ /auth/$1 break;
    proxy_pass http://auth:${AUTH_PORT};
  }

  location ~ ^/api/users/(.*)$ {
    rewrite ^/api/users/(.*)$ /users/$1 break;
    proxy_pass http://auth:${AUTH_PORT};
  }

  location = /_verify_lineups_session {
    internal;
    proxy_pass http://auth:${AUTH_PORT}/internal/auth/verify;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header X-Original-Method $lineups_original_method;
    proxy_set_header Authorization "";
  }

  location ~ ^/api/(lineups(?:/.*)?|simulations)/?$ {
    # Capture before auth_request changes the subrequest method to GET.
    set $lineups_original_method $request_method;
    auth_request /_verify_lineups_session;
    auth_request_set $lineups_user_id $upstream_http_x_authenticated_user_id;
    proxy_set_header X-Authenticated-User-ID $lineups_user_id;
    proxy_set_header X-User-ID "";
    proxy_set_header X-Original-Method "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-CSRF-Token "";
    proxy_read_timeout 100s;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://lineups:${LINEUPS_PORT};
  }

  location ~ ^/api/teams/?$ {
    rewrite ^ /teams break;
    proxy_pass http://stats:${STATS_PORT};
  }

  location ~ ^/api/batting/?$ {
    rewrite ^ /batting break;
    proxy_pass http://stats:${STATS_PORT};
  }

  location ~ ^/api/simulate/?$ {
    rewrite ^ /simulate break;
    proxy_pass http://simulation:${SIMULATION_PORT};
  }

  location ~ ^/api/optimize/?$ {
    rewrite ^ /optimize break;
    proxy_pass http://simulation:${SIMULATION_PORT};
  }

  location /api/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
